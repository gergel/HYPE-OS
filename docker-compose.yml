services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hype
      POSTGRES_PASSWORD: hype
      POSTGRES_DB: hype_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hype -d hype_os"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://hype:hype@postgres:5432/hype_os
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - export_storage:/app/var/storage

  # Galéria ZIP64 export worker - külön processz, az API nem csomagol.
  # Több példány is indítható (docker compose up --scale export-worker=2);
  # a sor az adatbázisban van, az elvétel atomikus.
  export-worker:
    build: ./backend
    command: python -m app.worker --concurrency 2
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://hype:hype@postgres:5432/hype_os
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - export_storage:/app/var/storage

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  # STORAGE_BACKEND=local esetén a privát objektumtár (API + worker közös).
  export_storage:
